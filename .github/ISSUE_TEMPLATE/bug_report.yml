name: Bug report
description: Something isn't working the way it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/codextde/autoseo/issues) first to avoid duplicates.

        Found a **security vulnerability**? Please don't file it here — see our
        [security policy](https://github.com/codextde/autoseo/security/policy) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reliably reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running AutoSEO?
      options:
        - deploy/install.sh (one-line installer)
        - Docker Compose (deploy/docker-compose.yml, prebuilt image)
        - Coolify
        - Built from source
        - AutoSEO Cloud (managed, autoseo.codext.de)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / image tag / commit
      description: Shown in Admin → System Health, or `docker compose logs app | head`, or your git commit.
      placeholder: e.g. ghcr.io/codextde/autoseo:latest, sha-abc1234, or v1.2.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Logs from `docker compose logs app` or the terminal, if applicable. Please redact secrets.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser/OS, screenshots, anything else that helps.
