name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: ubuntu-24.04
    # Integration tests run against a real database (same defaults as the dev setup in CONTRIBUTING.md).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autoseo
          POSTGRES_PASSWORD: autoseo
          POSTGRES_DB: autoseo
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U autoseo -d autoseo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://autoseo:autoseo@localhost:54329/autoseo
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next typegen && tsc --noEmit
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Create database schema
        run: pnpm db:push

      - name: Test
        run: pnpm test

  cloud:
    name: cloud
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next typegen && tsc --noEmit
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          AUTOSEO_SKIP_BOOT: "1"
